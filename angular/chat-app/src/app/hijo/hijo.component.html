<h1>Componente Hijo</h1>

<div class="mensaje">
    <label for="message" class="mensajeLabel">Mensaje del hijo</label>
    <input type="text" id="message" [(ngModel)]="mensaje">
    <button type="button" (click)="enviarMensaje()">Enviar mensaje desde el hijo</button>
</div>


<h2>Recibiendo mensaje del padre</h2>
<p>{{ recibirMensajes }}</p>
