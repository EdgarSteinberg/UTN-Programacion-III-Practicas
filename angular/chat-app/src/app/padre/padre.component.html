<h1>Componente Padre</h1>
<p class="mensajeRecibido">Mensaje recibido: <strong>{{ mensajeRecibido }}</strong></p>
<app-hijo (mensajeDesdeElHijo)="recibirMensaje($event)"></app-hijo>


<h2>Mensaje desde el padre</h2>

<input type="text" [(ngModel)]="mensajeInput">

<button type="button" (click)="enviarMensaje()">
  Enviar mensaje desde el padre
</button>

<app-hijo [recibirMensajes]="mensajeDesdeElpadre"></app-hijo>
