<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTNito | Login</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./login.css">
</head>

<body>
    <main class="login-page">
        <section class="login-card">

            <header class="brand-block">
                <img src="./assets/utnito-logo.svg" alt="UTNito logo" class="brand-logo">
                <h1>Welcome to UTNito</h1>
                <p class="subtitle">Sign in to chat with <strong>UTNito</strong></p>
            </header>

            <Form class="login-form" action="./chat.html" method="get" novalidate>
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="e.g carlos.gardel">

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password">

                <button type="submit">Login</button>
            </Form>

            <footer class="login-footer">
                <p>UTN Programación III</p>
                <p>Academic prototype for educational use.</p>
            </footer>
        </section>
    </main>
</body>

</html>
